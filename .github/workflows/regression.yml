name: Regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        direction: [a, b, c, d]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run regression (direction ${{ matrix.direction }})
        run: python -m pytest tests/ -q -m ${{ matrix.direction }}
