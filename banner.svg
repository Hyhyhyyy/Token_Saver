  <text x="70" y="150" font-size="60" font-weight="800" fill="url(#title)">Token_Saver</text>
  <text x="72" y="198" font-size="22" fill="#d4faf2" opacity="0.92">Prompt 压缩 · Token 成本看板</text>
  <g font-size="16" font-weight="600">
    <rect x="72" y="220" width="108" height="34" rx="17" fill="#2dd4bf" opacity="0.20" stroke="#5eead4" stroke-width="2"/>
    <text x="126" y="242" fill="#e3fbf6" text-anchor="middle">压缩</text>
    <rect x="192" y="220" width="108" height="34" rx="17" fill="#fbbf24" opacity="0.18" stroke="#fbbf24" stroke-width="2"/>
    <text x="246" y="242" fill="#fde9b0" text-anchor="middle">看板</text>
