<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="Token_Saver" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06231f"/>
      <stop offset="1" stop-color="#0c3b34"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <circle cx="960" cy="190" r="152" fill="#2dd4bf" opacity="0.07"/>
  <circle cx="960" cy="190" r="152" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.18"/>
  <rect x="-220" y="0" width="220" height="380" fill="url(#beam)">
    <animate attributeName="x" values="-220;1300;-220" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(960,190)">
    <circle r="118" fill="#041a17" stroke="#2dd4bf" stroke-width="8"/>
    <path d="M70,0 L35,61 L-35,61 L-70,0 L-35,-61 L35,-61 Z" fill="#0c3b34" stroke="#2dd4bf" stroke-width="8"/>
    <line x1="0" y1="-36" x2="0" y2="22" stroke="#fbbf24" stroke-width="9" stroke-linecap="round"/>
    <path d="M-13,10 L0,28 L13,10 Z" fill="#fbbf24"/>
  </g>
  <line x1="72" y1="170" x2="440" y2="170" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-dasharray="368" stroke-dashoffset="368">
    <animate attributeName="stroke-dashoffset" values="368;0;0;368" dur="6s" repeatCount="indefinite"/>
  </line>
  <text x="70" y="150" font-size="60" font-weight="800" fill="url(#title)">Token_Saver</text>
  <text x="72" y="198" font-size="22" fill="#bdf3e8" opacity="0.9">Prompt 压缩 · Token 成本看板</text>
  <g font-size="16" font-weight="600">
    <rect x="72" y="220" width="108" height="34" rx="17" fill="#2dd4bf" opacity="0.18" stroke="#5eead4" stroke-width="2"/>
    <text x="126" y="242" fill="#d4faf2" text-anchor="middle">压缩</text>
    <rect x="192" y="220" width="108" height="34" rx="17" fill="#fbbf24" opacity="0.16" stroke="#fbbf24" stroke-width="2"/>
    <text x="246" y="242" fill="#fde9b0" text-anchor="middle">看板</text>
  </g>
